# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
title: Beyond Defense Lab
email: afsah@unm.edu
description: > # this means to ignore newlines until "baseurl:"
  Website of the Beyond Defense Lab.
baseurl: ""
url: "https://beyondefense.org"

# Blog posts and workshops are one collection. Each item carries its own
# date, author and tags (blog / workshop) in front matter.
collections:
  outreach:
    output: true
    permalink: /outreach/:name/

# Required: workshops are announced before they happen, and Jekyll silently
# refuses to build documents with a future date unless this is true.
future: true

include:
  - .htaccess
  - _pages

sass:
  sass_dir: _sass

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false



# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true # default for kramdown is false. This will enable using Markdown links
