<div class="well">
  <h4>News</h4>

  {% for article in site.data.news limit:9 %}
  <p><em>{{ article.date }}</em>{{ article.headline | markdownify | remove: '<p>' | remove: '</p>' }}</p>
  {% endfor %}

  <a class="see-all" href="{{ site.url }}{{ site.baseurl }}/allnews.html">See all news &rarr;</a>
</div>
